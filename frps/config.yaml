# https://contributors.home-assistant.io/apps/reference/configuration/
name: FRP Server
version: "0.72.0.3"
slug: frps
description: Self-hosted ngrok alternative – the frp tunnel server (frps)
url: "https://github.com/bjorngadde/fast-reverse-proxy-ha-app/tree/main/frps"
arch:
  - aarch64
  - amd64
startup: services
init: false
# frps opens ports on demand (TCP/UDP proxies), so it needs the host network
# rather than a fixed list of mapped ports.
host_network: true
# Sidebar panel showing the frps dashboard.
ingress: true
ingress_port: 7599
panel_icon: mdi:tunnel-outline
panel_title: FRP
options:
  bind_port: 7000
  force_tls: true
  vhost_http_port: 7080
  subdomain_host: ""
  allow_ports: ""
  max_ports_per_client: 0
  dashboard_port: 7500
  dashboard_user: admin
  metrics_port: 0
  log_level: info
  users: []
schema:
  auth_token: password?
  bind_port: port
  force_tls: bool
  vhost_http_port: port
  subdomain_host: str?
  allow_ports: "match(^$|^\\d+(-\\d+)?(\\s*,\\s*\\d+(-\\d+)?)*$)?"
  max_ports_per_client: int(0,)
  dashboard_port: port
  dashboard_user: str
  dashboard_password: password?
  metrics_port: int(0,65535)
  log_level: list(trace|debug|info|warn|error)
  users:
    - name: "match(^[a-z0-9][a-z0-9_-]{0,31}$)"
      token: "password(16,)"
      subdomains: str?
